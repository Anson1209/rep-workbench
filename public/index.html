<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1f3a5e" />
  <title>量子枢纽</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Desktop sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="3" fill="#fff"/>
            <path d="M12 3 L12 6 M12 18 L12 21 M3 12 L6 12 M18 12 L21 12" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M5.6 5.6 L7.5 7.5 M16.5 16.5 L18.4 18.4 M5.6 18.4 L7.5 16.5 M16.5 7.5 L18.4 5.6" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <strong>量子枢纽</strong>
          <span>工作台</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="菜单">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <h1 class="topbar-title" id="topbarTitle">项目概览</h1>
        <div class="sync-wrap">
          <button class="sync-indicator" id="syncIndicator" title="点击手动同步 / 设置同步间隔（双端实时同步）" aria-haspopup="true" aria-expanded="false">
            <span class="sync-dot" id="syncDot"></span>
            <span class="sync-text" id="syncText">同步中…</span>
            <svg class="sync-caret" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="sync-menu" id="syncMenu" role="menu" aria-hidden="true">
            <div class="sync-menu-title">同步间隔（手动）</div>
            <button class="sync-opt" type="button" role="menuitemradio" data-min="1">1 分钟</button>
            <button class="sync-opt" type="button" role="menuitemradio" data-min="10">10 分钟</button>
            <button class="sync-opt" type="button" role="menuitemradio" data-min="30">30 分钟</button>
            <div class="sync-menu-sep"></div>
            <button class="sync-opt sync-now" type="button" id="syncNowBtn" role="menuitem">立即同步</button>
          </div>
        </div>
      </header>
      <section class="view" id="view"></section>
    </div>

    <!-- Mobile bottom nav -->
    <nav class="bottomnav" id="bottomnav"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- Login / first-time setup overlay -->
  <div id="auth-overlay" class="auth-overlay" style="display:none">
    <div class="auth-card">
      <div class="auth-logo">量</div>
      <h2 id="auth-title">访问验证</h2>
      <p class="muted tiny" id="auth-sub">请输入访问密码</p>
      <input type="password" id="auth-pw" class="auth-input" placeholder="访问密码" autocomplete="current-password" />
      <div id="auth-pw2-wrap" style="display:none;margin-top:10px">
        <input type="password" id="auth-pw2" class="auth-input" placeholder="再次输入密码" autocomplete="new-password" />
      </div>
      <button id="auth-btn" class="btn btn-primary auth-btn">进入</button>
      <div id="auth-msg" class="auth-msg"></div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/customers.js"></script>
  <script src="/js/calendar.js"></script>
  <script src="/js/survey.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
