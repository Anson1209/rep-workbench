<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e6fe0" />
  <title>医药代表工作助手</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Desktop sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">医</div>
        <div class="brand-text">
          <strong>医药代表</strong>
          <span>工作助手</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <span id="sync-status" class="sync-dot" title="数据已同步至云端">● 已同步</span>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="菜单">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <h1 class="topbar-title" id="topbarTitle">客户资料</h1>
        <div class="topbar-stats" id="topbarStats"></div>
      </header>
      <section class="view" id="view"></section>
    </div>

    <!-- Mobile bottom nav -->
    <nav class="bottomnav" id="bottomnav"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="/js/common.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/customers.js"></script>
  <script src="/js/calendar.js"></script>
  <script src="/js/survey.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
